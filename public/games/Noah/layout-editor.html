<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诺亚方舟 · 素材布局编辑器</title>
  <link rel="stylesheet" href="layout-editor.css">
</head>
<body>
  <header class="header">
    <h1>素材布局编辑器</h1>
    <p>还原游戏场景，手动拖动 / 缩放建筑素材，导出 JSON 供对齐正式插槽规则。</p>
    <nav class="nav">
      <a href="index.html">游戏</a>
      <a href="sprite-splitter.html">精灵图拆分</a>
      <a href="build-test.html">自动建造测试</a>
    </nav>
  </header>

  <div class="workspace">
    <aside class="library">
      <h2>素材库</h2>
      <label class="filter">
        <span>分类</span>
        <select id="catFilter">
          <option value="all">全部</option>
          <option value="gemini">Gemini 拆分素材</option>
          <option value="platform">平台</option>
          <option value="wall">墙面</option>
          <option value="edge">墙边界</option>
          <option value="door">门</option>
          <option value="window">窗</option>
          <option value="eave">屋檐</option>
          <option value="other">其他</option>
        </select>
      </label>
      <ul id="assetList" class="asset-list"></ul>
      <p class="hint">列表顶部为 Gemini 拆分素材（紫标）；也可在分类中选「Gemini 拆分素材」。点击添加到场景。</p>
    </aside>

    <div class="stage-wrap">
      <canvas id="stage" width="1024" height="576"></canvas>
      <p class="stage-hint">滚轮上下滑动视野 · 拖动物体移动 · 拖右下角缩放 · 点击船体可缩放</p>
    </div>

    <aside class="inspector">
      <h2>选中对象</h2>
      <div id="noSelection" class="muted">未选中</div>
      <div id="selectionPanel" hidden>
        <p class="file-name" id="selFile"></p>
        <label>X <input type="number" id="inpX" step="1"></label>
        <label>Y <input type="number" id="inpY" step="1"></label>
        <label>宽 <input type="number" id="inpW" step="1" min="8"></label>
        <label>高 <input type="number" id="inpH" step="1" min="8"></label>
        <label class="chk"><input type="checkbox" id="inpFlip"> 水平翻转</label>
        <label>备注 <input type="text" id="inpNote" placeholder="如：L1左侧墙"></label>
        <div class="btn-row">
          <button type="button" class="btn" id="btnDup">复制</button>
          <button type="button" class="btn danger" id="btnDel">删除</button>
        </div>
        <div class="btn-row">
          <button type="button" class="btn sm" id="btnUp">上移层</button>
          <button type="button" class="btn sm" id="btnDown">下移层</button>
        </div>
      </div>

      <h2>船体</h2>
      <label class="boat-scale">
        <span>缩放</span>
        <input type="range" id="inpBoatScale" min="2" max="10" step="0.1" value="5.2">
        <input type="number" id="inpBoatScaleNum" min="2" max="10" step="0.1" value="5.2">
      </label>
      <p class="hint">侧栏滑块或点击船后拖右下角；数值写入导出 JSON 的 <code>boatScale</code></p>

      <h2>场景</h2>
      <label class="chk"><input type="checkbox" id="chkGuides" checked> 辅助线（船体 / 建造区）</label>
      <label class="chk"><input type="checkbox" id="chkRod" checked> 显示鱼竿参考</label>
      <label class="chk"><input type="checkbox" id="chkSnap" > 网格吸附 (8px)</label>
      <button type="button" class="btn" id="btnClear">清空所有素材</button>

      <h2>导出 / 导入</h2>
      <button type="button" class="btn primary" id="btnExport">复制布局 JSON</button>
      <button type="button" class="btn" id="btnImport">从剪贴板导入</button>
      <button type="button" class="btn" id="btnSaveLocal">保存到浏览器</button>
      <button type="button" class="btn" id="btnLoadLocal">读取浏览器存档</button>
      <textarea id="jsonOut" class="json-out" readonly placeholder="布局 JSON…"></textarea>
    </aside>
  </div>

  <script src="layout-editor.js"></script>
</body>
</html>
