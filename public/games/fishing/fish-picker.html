<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>鱼种选择器</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#1a3a5c;color:#fff;font-family:monospace;padding:20px}
    h1{margin-bottom:12px}
    #info{background:#0a1a2a;padding:8px 12px;border-radius:4px;font-size:13px;min-height:24px;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(12,auto);gap:1px;margin-bottom:24px;background:#333;border:2px solid #456;width:fit-content}
    .cell{width:48px;height:48px;cursor:pointer;position:relative;image-rendering:pixelated}
    .cell canvas{width:48px;height:48px;display:block;image-rendering:pixelated}
    .cell:hover{outline:2px solid #0f0;z-index:1}
    .cell.selected{outline:3px solid #ff0;z-index:2}
    .cell .idx{position:absolute;top:1px;left:2px;font-size:8px;color:rgba(255,255,255,0.5);pointer-events:none}
    h2{color:#8cf;margin:16px 0 8px}
    .selected-list{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .fish-item{background:#0a1a2a;border:2px solid #456;padding:8px;border-radius:4px;text-align:center;width:120px}
    .fish-item canvas{width:64px;height:64px;margin:0 auto 6px;display:block;image-rendering:pixelated}
    .fish-item input{width:100%;background:#1a2a3a;border:1px solid #456;color:#fff;padding:3px 6px;font-size:11px;font-family:monospace;text-align:center;border-radius:2px}
    .fish-item .pos{font-size:9px;color:#888;margin-top:4px}
    button{padding:6px 16px;font-size:13px;cursor:pointer;background:#2a5a8a;color:#fff;border:1px solid #4a8aba;border-radius:4px;margin-right:6px;margin-bottom:8px}
    button:hover{background:#3a7aba}
    pre{background:#0a1a2a;padding:12px;border-radius:6px;font-size:11px;max-height:200px;overflow:auto;user-select:text;-webkit-user-select:text}
  </style>
</head>
<body>
<h1>🐟 鱼种选择器 (fishes.png 12×12 网格, 32×32/格)</h1>
<p style="color:#aaa;margin-bottom:12px">点击格子选择鱼种（最多7个），为每条鱼命名，然后导出</p>
<div id="info">加载中...</div>

<h2>完整网格（点击选择）</h2>
<div class="grid" id="grid"></div>

<h2>已选择的鱼种（点击可取消，可拖动排序）</h2>
<div class="selected-list" id="selectedList"></div>

<button onclick="exportResult()">📋 导出结果</button>
<button onclick="copyResult()">复制到剪贴板</button>
<button onclick="clearSelection()">清除选择</button>

<h2>导出数据</h2>
<pre id="output">选择鱼种后点击"导出结果"</pre>

<script>
var COLS = 12, ROWS = 12, SIZE = 32;
var selected = []; // [{row, col, name}]
var img;

function loadGrid(){
  img = new Image();
  img.onload = function(){
    document.getElementById('info').textContent = '✅ 加载完成 (' + img.width + '×' + img.height + ') — 点击格子选择鱼';
    var grid = document.getElementById('grid');
    for(var r = 0; r < ROWS; r++){
      for(var c = 0; c < COLS; c++){
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.setAttribute('data-r', r);
        cell.setAttribute('data-c', c);

        var cv = document.createElement('canvas');
        cv.width = SIZE; cv.height = SIZE;
        var ctx = cv.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, c * SIZE, r * SIZE, SIZE, SIZE, 0, 0, SIZE, SIZE);

        // Check if cell is empty (all transparent)
        var id = ctx.getImageData(0, 0, SIZE, SIZE);
        var hasPixels = false;
        for(var i = 3; i < id.data.length; i += 4){
          if(id.data[i] > 0){ hasPixels = true; break; }
        }

        var idx = document.createElement('div');
        idx.className = 'idx';
        idx.textContent = r + ',' + c;

        cell.appendChild(cv);
        cell.appendChild(idx);
        if(!hasPixels) cell.style.opacity = '0.3';

        cell.onclick = function(){
          var cr = +this.getAttribute('data-r');
          var cc = +this.getAttribute('data-c');
          toggleSelect(cr, cc, this);
        };

        grid.appendChild(cell);
      }
    }
  };
  img.onerror = function(){ document.getElementById('info').textContent = '❌ 加载失败'; };
  img.src = 'assets/fishes.png';
}

function toggleSelect(r, c, cellEl){
  var idx = selected.findIndex(function(s){ return s.row === r && s.col === c; });
  if(idx >= 0){
    selected.splice(idx, 1);
    cellEl.classList.remove('selected');
  } else {
    if(selected.length >= 20){
      document.getElementById('info').textContent = '⚠️ 最多选择20个鱼种';
      return;
    }
    selected.push({row: r, col: c, name: '鱼' + (selected.length + 1)});
    cellEl.classList.add('selected');
  }
  renderSelected();
}

function renderSelected(){
  var list = document.getElementById('selectedList');
  list.innerHTML = '';
  selected.forEach(function(s, i){
    var item = document.createElement('div');
    item.className = 'fish-item';

    var cv = document.createElement('canvas');
    cv.width = SIZE; cv.height = SIZE;
    cv.style.width = '64px'; cv.style.height = '64px';
    var ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, s.col * SIZE, s.row * SIZE, SIZE, SIZE, 0, 0, SIZE, SIZE);

    var input = document.createElement('input');
    input.value = s.name;
    input.placeholder = '鱼名';
    input.oninput = function(){ s.name = this.value; };

    var pos = document.createElement('div');
    pos.className = 'pos';
    pos.textContent = '#' + (i+1) + ' 位置(' + s.row + ',' + s.col + ')';

    item.appendChild(cv);
    item.appendChild(input);
    item.appendChild(pos);
    list.appendChild(item);
  });
}

function exportResult(){
  var result = selected.map(function(s, i){
    return {
      index: i,
      name: s.name,
      row: s.row,
      col: s.col,
      srcX: s.col * SIZE,
      srcY: s.row * SIZE,
      size: SIZE
    };
  });
  document.getElementById('output').textContent = JSON.stringify(result, null, 2);
}

function copyResult(){
  var text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(function(){
    document.getElementById('info').textContent = '✅ 已复制到剪贴板';
  });
}

function clearSelection(){
  selected = [];
  document.querySelectorAll('.cell.selected').forEach(function(el){ el.classList.remove('selected'); });
  renderSelected();
}

loadGrid();
</script>
</body>
</html>
