<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub</title>
  <link rel="stylesheet" href="shared/common.css">
  <style>
    body { background: #0f0f1a; overflow-x: hidden; }

    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      background: #12121f;
      border-bottom: 1px solid #1e1e35;
    }
    .page-header a {
      color: #aaa;
      font-size: 14px;
      padding: 6px 14px;
      background: #1e1e35;
      border-radius: 6px;
      transition: all .2s;
    }
    .page-header a:hover { background: #7b2ff7; color: #fff; }
    .page-header .game-title {
      font-size: 18px;
      color: #e0e0e0;
    }

    .page-body {
      display: flex;
      gap: 16px;
      padding: 16px 24px;
      min-height: calc(100vh - 56px);
    }

    /* 左侧主区域 */
    .main-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 游戏容器 */
    .game-frame-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a4a;
    }
    .game-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .game-frame-wrap.fullscreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      aspect-ratio: auto;
      border-radius: 0;
      border: none;
    }

    /* 游戏底栏 */
    .game-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #1a1a2e;
      border-radius: 0 0 12px 12px;
      margin-top: -16px;
      border: 1px solid #2a2a4a;
      border-top: none;
    }
    .game-toolbar .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .game-toolbar .game-name {
      font-size: 15px;
      color: #e0e0e0;
    }
    .toolbar-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all .2s;
    }
    .toolbar-btn:hover { color: #fff; background: rgba(255,255,255,.08); }
    .toolbar-actions { display: flex; gap: 4px; }

    /* 游戏信息区 */
    .game-info-section {
      background: #1a1a2e;
      border-radius: 12px;
      border: 1px solid #2a2a4a;
      padding: 20px 24px;
    }
    .info-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .info-header img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: cover;
      background: #2a2a4a;
    }
    .info-header .info-title h2 {
      font-size: 20px;
      color: #e0e0e0;
      margin-bottom: 4px;
    }
    .info-header .info-title .info-tags {
      display: flex;
      gap: 8px;
    }
    .info-tag {
      font-size: 12px;
      padding: 2px 10px;
      background: #2a2a4a;
      border-radius: 10px;
      color: #aaa;
    }
    .rating-placeholder {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #666;
      font-size: 14px;
    }
    .rating-stars { color: #555; font-size: 20px; letter-spacing: 2px; }
    .game-desc {
      color: #888;
      font-size: 14px;
      line-height: 1.7;
      min-height: 48px;
    }

    /* 右侧推荐栏 */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-title {
      font-size: 14px;
      color: #888;
      padding: 4px 0 8px;
      border-bottom: 1px solid #1e1e35;
      margin-bottom: 4px;
    }
    .rec-card {
      display: flex;
      gap: 10px;
      padding: 8px;
      background: #1a1a2e;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      transition: all .2s;
      cursor: pointer;
      align-items: center;
    }
    .rec-card:hover {
      border-color: #7b2ff7;
      background: #1e1e35;
    }
    .rec-card img {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      background: #2a2a4a;
      flex-shrink: 0;
    }
    .rec-card .rec-info {
      min-width: 0;
    }
    .rec-card .rec-name {
      font-size: 13px;
      color: #e0e0e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-card .rec-tag {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }

    /* 响应式：窄屏隐藏侧栏 */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .page-body { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <a href="index.html">← 返回</a>
    <span class="game-title" id="pageTitle">加载中...</span>
  </div>

  <div class="page-body">
    <div class="main-col">
      <div class="game-frame-wrap" id="frameWrap">
        <iframe id="gameFrame" allowfullscreen></iframe>
      </div>
      <div class="game-toolbar">
        <div class="toolbar-left">
          <span class="game-name" id="toolbarName"></span>
        </div>
        <div class="toolbar-actions">
          <button class="toolbar-btn" id="fullscreenBtn" title="全屏">⛶</button>
        </div>
      </div>

      <div class="game-info-section">
        <div class="info-header">
          <img id="infoCover" src="" alt="">
          <div class="info-title">
            <h2 id="infoName"></h2>
            <div class="info-tags">
              <span class="info-tag" id="infoCategory"></span>
            </div>
          </div>
        </div>
        <div class="rating-placeholder">
          <span class="rating-stars">☆☆☆☆☆</span>
          <span>暂无评分</span>
        </div>
        <div class="game-desc" id="infoDesc">暂无介绍</div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-title">🎮 推荐游戏</div>
      <div id="recList"></div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      var games = [
        { id:'feed-fish', name:'摸大鲲', category:'经营', desc:'收集金币喂鱼，养出传说中的鲲' },
        { id:'alcohol', name:'酒吧模拟器', category:'休闲', desc:'扮演调酒师，记住配方，为顾客调制鸡尾酒' },
        { id:'jump', name:'撅地求生', category:'休闲', desc:'踩着弹簧飞向太空，躲避障碍物' },
        { id:'fishing', name:'钓鱼达人', category:'休闲', desc:'抛竿钓鱼，收集稀有鱼种，升级装备成为钓鱼大师' }
      ];

      // 从 URL 参数获取游戏 ID
      var params = new URLSearchParams(window.location.search);
      var gameId = params.get('id');
      var game = games.find(function(g){ return g.id === gameId; });

      if (!game) {
        document.getElementById('pageTitle').textContent = '游戏未找到';
        return;
      }

      // 填充页面信息
      document.title = game.name + ' - GameHub';
      document.getElementById('pageTitle').textContent = game.name;
      document.getElementById('toolbarName').textContent = game.name;
      document.getElementById('infoName').textContent = game.name;
      document.getElementById('infoCategory').textContent = game.category;
      document.getElementById('infoDesc').textContent = game.desc || '暂无介绍';
      document.getElementById('infoCover').src = 'games/' + game.id + '/assets/cover.webp';

      // 加载游戏 iframe
      document.getElementById('gameFrame').src = 'games/' + game.id + '/index.html';

      // 全屏切换
      var frameWrap = document.getElementById('frameWrap');
      var fullscreenBtn = document.getElementById('fullscreenBtn');

      fullscreenBtn.addEventListener('click', function() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          frameWrap.requestFullscreen().catch(function() {
            // 回退：CSS 全屏
            frameWrap.classList.toggle('fullscreen');
          });
        }
      });

      document.addEventListener('fullscreenchange', function() {
        fullscreenBtn.textContent = document.fullscreenElement ? '⛶' : '⛶';
      });

      // ESC 退出 CSS 全屏
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && frameWrap.classList.contains('fullscreen')) {
          frameWrap.classList.remove('fullscreen');
        }
      });

      // 推荐列表：排除当前游戏，随机排列
      var others = games.filter(function(g){ return g.id !== gameId; });
      for (var i = others.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = others[i]; others[i] = others[j]; others[j] = tmp;
      }

      var recList = document.getElementById('recList');
      others.forEach(function(g) {
        var a = document.createElement('a');
        a.className = 'rec-card';
        a.href = 'game.html?id=' + g.id;
        a.innerHTML =
          '<img src="games/' + g.id + '/assets/cover.webp" alt="' + g.name + '">' +
          '<div class="rec-info">' +
            '<div class="rec-name">' + g.name + '</div>' +
            '<div class="rec-tag">' + g.category + '</div>' +
          '</div>';
        recList.appendChild(a);
      });
    })();
  </script>
</body>
</html>
