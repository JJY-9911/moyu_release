<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>撅地求生 - GameHub</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;}
    canvas{display:block;margin:0 auto;touch-action:none;}
    .back-btn{position:fixed;top:8px;left:8px;z-index:100;padding:5px 12px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);border-radius:6px;color:#ccc;cursor:pointer;font-size:12px;text-decoration:none;}
    .back-btn:hover{background:rgba(255,255,255,0.15);color:#fff;}
  </style>
</head>
<body>
  <a href="../../index.html" class="back-btn">← 返回</a>
  <script>if(window!==window.top)document.querySelector('.back-btn').style.display='none';</script>
  <canvas id="game"></canvas>
  <script src="main.js"></script>
</body>
</html>
