<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>酒吧模拟器 - GameHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 启动页遮罩 -->
  <div id="splashScreen" class="splash-screen">
    <img src="assets/cover.png" alt="加载中" class="splash-img" draggable="false">
    <div class="splash-bottom">
      <div class="splash-progress-bar"><div id="splashProgress" class="splash-progress-fill"></div></div>
      <div class="splash-loading" id="splashText">加载中… 0%</div>
    </div>
  </div>

  <a href="../../index.html" class="top-btn back-btn">← 返回</a>

  <div class="game-wrapper">
    <!-- 上部行：预留空间 | 消息区 -->
    <div class="upper-row">
      <div class="upper-space" id="upperSection"></div>
      <div class="message-panel" id="messagePanel">
        <div class="message-panel-title">📢 消息
    <button id="skipTutorialBtn" class="skip-btn" style="display:none">跳过引导</button>
  </div>
        <div class="message-list" id="messageList"></div>
      </div>
    </div>

    <!-- 下部行：[水池/冰柜] | 吧台 | 酒柜 -->
    <div class="lower-row">
      <!-- 左列：水池(上) + 冰柜(下) -->
      <div class="left-stack">
        <div class="sink-area" id="sinkSlot">
          <img src="assets/sink.png" alt="水池" draggable="false">
          <div class="sink-badges" id="sinkBadges"></div>
        </div>
        <div class="freezer-area" id="iceSlot">
          <img src="assets/ice.png" alt="冰柜" draggable="false">
        </div>
      </div>

      <!-- 吧台 -->
      <div class="bar-counter" id="barCounter">
        <div class="bar-bg"><img src="assets/desk.png" alt="吧台" draggable="false"></div>
        <div class="bar-tool" id="orderSlot" style="left:12px;top:12px;">
          <img src="assets/order.png" alt="订单机" draggable="false">
          <span>订单机</span>
          <div class="order-badge" id="orderBadge" style="display:none">0</div>
        </div>
        <div class="bar-tool" id="recipeSlot" style="left:148px;top:12px;">
          <img src="assets/recipe.png" alt="配方本" draggable="false">
          <span>配方本</span>
        </div>
        <div class="bar-tool" id="handbookSlot" style="left:284px;top:12px;">
          <img src="assets/handbook.png" alt="酒图签" draggable="false">
          <span>酒图签</span>
        </div>
        <div class="bar-tool" id="clampSlot" style="left:148px;bottom:12px;">
          <img src="assets/clamp.png" alt="冰夹" draggable="false">
          <span>冰夹</span>
        </div>
        <div class="bar-tool" id="spoonSlot" style="left:12px;bottom:12px;">
          <img src="assets/spoon.png" alt="吧勺" draggable="false">
          <span>吧勺</span>
        </div>
        <div class="bar-tool" id="shakerSlot" style="right:12px;top:12px;">
          <img src="assets/shake.png" alt="雪克壶" draggable="false">
          <span>雪克壶</span>
        </div>
      </div>

      <!-- 酒柜 -->
      <div class="cabinet-area" id="cabinetArea">
        <div class="cabinet-header">
          <span>酒柜</span>
          <button id="editModeBtn" class="edit-mode-btn">📐 编辑模式</button>
        </div>
        <div class="cabinet-grid" id="cabinetGrid"></div>
      </div>
    </div>
  </div>

  <div id="floatingItem" class="floating-item" style="display:none">
    <img id="floatingImg" src="" alt="" draggable="false">
  </div>
  <div id="shakerIndicator" class="shaker-indicator" style="display:none">
    <div class="shaker-title">雪克壶内容物</div>
    <div id="shakerContents" class="shaker-contents"></div>
  </div>
  <div id="orderModal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="modal-header"><h3>📋 订单列表</h3><button class="modal-close" data-close="orderModal">✕</button></div>
      <div class="modal-body" id="orderList"></div>
    </div>
  </div>
  <div id="handbookModal" class="modal" style="display:none">
    <div class="modal-content modal-wide">
      <div class="modal-header"><h3>🏷️ 酒图签</h3><button class="modal-close" data-close="handbookModal">✕</button></div>
      <div class="modal-body" id="handbookList"></div>
    </div>
  </div>
  <div id="recipeModal" class="modal" style="display:none">
    <div class="modal-content modal-wide">
      <div class="modal-header"><h3>📖 配方本</h3><button class="modal-close" data-close="recipeModal">✕</button></div>
      <div class="modal-body" id="recipeList"></div>
    </div>
  </div>
  <div id="glassTooltip" class="glass-tooltip" style="display:none"></div>
  <script>
    (function() {
      var splash = document.getElementById('splashScreen');
      var splashText = document.getElementById('splashText');
      var progressFill = document.getElementById('splashProgress');

      // 所有游戏用到的图片（去重列表）
      var allImages = [
        'assets/cover.png',
        'assets/bg.png', 'assets/desk.png', 'assets/sink.png', 'assets/ice.png',
        'assets/order.png', 'assets/recipe.png', 'assets/handbook.png',
        'assets/clamp.png', 'assets/spoon.png', 'assets/shake.png',
        'assets/collins-glass.png', 'assets/whiskey-glass.png',
        'assets/martini-glass.png', 'assets/margaret-glass.png',
        'assets/champagne-glass.png', 'assets/wine-cabinet.png',
        'assets/wine/gin.png', 'assets/wine/vodka.png', 'assets/wine/Tequila.png',
        'assets/wine/rum.png', 'assets/wine/champagne.png',
        'assets/wine/coffee.png', 'assets/wine/vermouth.png',
        'assets/wine/red-vermouth.png', 'assets/wine/lemon.png',
        'assets/wine/juice.png', 'assets/wine/milk.png',
        'assets/wine/tonic.png', 'assets/wine/soda.png',
        'assets/wine/Grenadine-Syrup.png', 'assets/wine/brandy.png',
        'assets/people/people1.png', 'assets/people/people2.png',
        'assets/people/people3.png', 'assets/people/people4.png',
        'assets/people/people5.png', 'assets/people/people6.png',
        'assets/people/people7.png', 'assets/people/people8.png'
      ];

      var total = allImages.length;
      var loaded = 0;
      var done = false;
      // src → blob URL 映射，供 main.js 使用
      var cache = {};
      window.__imageCache = cache;

      function updateProgress(pct) {
        progressFill.style.width = pct + '%';
        splashText.textContent = '加载中… ' + pct + '%';
      }

      function fadeOut() {
        if (done) return;
        done = true;
        splash.classList.add('splash-fade');
        splash.addEventListener('transitionend', function() {
          splash.remove();
        });
      }

      // 用 fetch 下载图片为 blob，确保二进制数据完整
      function fetchImage(src) {
        return fetch(src)
          .then(function(res) {
            if (!res.ok) throw new Error(res.status);
            return res.blob();
          })
          .then(function(blob) {
            var url = URL.createObjectURL(blob);
            cache[src] = url;
          })
          .catch(function() {
            // 失败时回退到原始路径
            cache[src] = src;
          })
          .then(function() {
            loaded++;
            updateProgress(Math.round((loaded / total) * 90));
          });
      }

      updateProgress(0);

      // 并发下载所有图片
      Promise.all(allImages.map(fetchImage)).then(function() {
        updateProgress(92);

        // 替换 HTML 中已有的 <img> src 为 blob URL
        var htmlImgs = document.querySelectorAll('img[src]');
        htmlImgs.forEach(function(img) {
          var src = img.getAttribute('src');
          if (cache[src]) img.src = cache[src];
        });

        // 替换 CSS 背景图（bg.png）
        var wrapper = document.querySelector('.game-wrapper');
        if (wrapper && cache['assets/bg.png']) {
          wrapper.style.backgroundImage = 'url(' + cache['assets/bg.png'] + ')';
        }

        updateProgress(95);

        // 加载 main.js
        window.__onGameReady = function() {
          updateProgress(100);
          // 等一帧确保渲染完成
          requestAnimationFrame(function() { fadeOut(); });
        };

        var s = document.createElement('script');
        s.src = 'main.js';
        s.onerror = function() { fadeOut(); };
        document.body.appendChild(s);
      });

      // 兜底：最多15秒后强制启动
      setTimeout(function() {
        if (!done) {
          updateProgress(100);
          fadeOut();
        }
      }, 15000);
    })();
  </script>
</body>
</html>
