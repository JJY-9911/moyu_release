<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>酒吧模拟器 - GameHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 启动页遮罩 -->
  <div id="splashScreen" class="splash-screen">
    <img src="assets/cover.webp" alt="加载中" class="splash-img" draggable="false">
    <div class="splash-bottom">
      <div class="splash-progress-bar"><div id="splashProgress" class="splash-progress-fill"></div></div>
      <div class="splash-loading" id="splashText">加载中… 0%</div>
    </div>
  </div>

  <a href="../../index.html" class="top-btn back-btn">← 返回</a>

  <div class="game-wrapper" style="visibility:hidden">
    <!-- 上部行：预留空间 | 消息区 -->
    <div class="upper-row">
      <div class="upper-space" id="upperSection">
        <div class="customer-area" id="customerArea"></div>
      </div>
      <div class="message-panel" id="messagePanel">
        <div class="message-panel-title">📢 消息
    <button id="skipTutorialBtn" class="skip-btn" style="display:none">跳过引导</button>
  </div>
        <div class="message-list" id="messageList"></div>
      </div>
    </div>

    <!-- 下部行：[水池/冰柜] | 吧台 | 酒柜 -->
    <div class="lower-row">
      <!-- 左列：水池(上) + 冰柜(下) -->
      <div class="left-stack">
        <div class="sink-area" id="sinkSlot">
          <img data-src="assets/sink.webp" alt="水池" draggable="false">
          <div class="sink-badges" id="sinkBadges"></div>
        </div>
        <div class="freezer-area" id="iceSlot">
          <img data-src="assets/ice.webp" alt="冰柜" draggable="false">
        </div>
      </div>

      <!-- 吧台 -->
      <div class="bar-counter" id="barCounter">
        <div class="bar-bg"><img data-src="assets/desk.webp" alt="吧台" draggable="false"></div>
        <div class="bar-tool" id="orderSlot" style="left:12px;top:12px;">
          <img data-src="assets/order.webp" alt="订单机" draggable="false">
          <span>订单机</span>
          <div class="order-badge" id="orderBadge" style="display:none">0</div>
        </div>
        <div class="bar-tool" id="recipeSlot" style="left:148px;top:12px;">
          <img data-src="assets/recipe.webp" alt="配方本" draggable="false">
          <span>配方本</span>
        </div>
        <div class="bar-tool" id="handbookSlot" style="left:284px;top:12px;">
          <img data-src="assets/handbook.webp" alt="酒图签" draggable="false">
          <span>酒图签</span>
        </div>
        <div class="bar-tool" id="clampSlot" style="left:148px;bottom:12px;">
          <img data-src="assets/clamp.webp" alt="冰夹" draggable="false">
          <span>冰夹</span>
        </div>
        <div class="bar-tool" id="spoonSlot" style="left:12px;bottom:12px;">
          <img data-src="assets/spoon.webp" alt="吧勺" draggable="false">
          <span>吧勺</span>
        </div>
        <div class="bar-tool" id="shakerSlot" style="right:12px;top:12px;">
          <img data-src="assets/shake.webp" alt="雪克壶" draggable="false">
          <span>雪克壶</span>
        </div>
      </div>

      <!-- 酒柜 -->
      <div class="cabinet-area" id="cabinetArea">
        <div class="cabinet-header">
          <span>酒柜</span>
          <button id="editModeBtn" class="edit-mode-btn">📐 编辑模式</button>
        </div>
        <div class="cabinet-grid" id="cabinetGrid"></div>
      </div>
    </div>
  </div>

  <div id="floatingItem" class="floating-item" style="display:none">
    <img id="floatingImg" src="" alt="" draggable="false">
  </div>
  <div id="shakerIndicator" class="shaker-indicator" style="display:none">
    <div class="shaker-title">雪克壶内容物</div>
    <div id="shakerContents" class="shaker-contents"></div>
  </div>
  <div id="orderModal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="modal-header"><h3>📋 订单列表</h3><button class="modal-close" data-close="orderModal">✕</button></div>
      <div class="modal-body" id="orderList"></div>
    </div>
  </div>
  <div id="handbookModal" class="modal" style="display:none">
    <div class="modal-content modal-wide">
      <div class="modal-header"><h3>🏷️ 酒图签</h3><button class="modal-close" data-close="handbookModal">✕</button></div>
      <div class="modal-body" id="handbookList"></div>
    </div>
  </div>
  <div id="recipeModal" class="modal" style="display:none">
    <div class="modal-content modal-wide">
      <div class="modal-header"><h3>📖 配方本</h3><button class="modal-close" data-close="recipeModal">✕</button></div>
      <div class="modal-body" id="recipeList"></div>
    </div>
  </div>
  <div id="glassTooltip" class="glass-tooltip" style="display:none"></div>
  <script>
    (function() {
      var splash = document.getElementById('splashScreen');
      var splashText = document.getElementById('splashText');
      var progressFill = document.getElementById('splashProgress');
      var gameWrapper = document.querySelector('.game-wrapper');

      var allImages = [
        'assets/cover.webp',
        'assets/bg.webp', 'assets/desk.webp', 'assets/sink.webp', 'assets/ice.webp',
        'assets/order.webp', 'assets/recipe.webp', 'assets/handbook.webp',
        'assets/clamp.webp', 'assets/spoon.webp', 'assets/shake.webp',
        'assets/collins-glass.webp', 'assets/whiskey-glass.webp',
        'assets/martini-glass.webp', 'assets/margaret-glass.webp',
        'assets/champagne-glass.webp', 'assets/wine-cabinet.webp',
        'assets/wine/gin.webp', 'assets/wine/vodka.webp', 'assets/wine/Tequila.webp',
        'assets/wine/rum.webp', 'assets/wine/champagne.webp',
        'assets/wine/coffee.webp', 'assets/wine/vermouth.webp',
        'assets/wine/red-vermouth.webp', 'assets/wine/lemon.webp',
        'assets/wine/juice.webp', 'assets/wine/milk.webp',
        'assets/wine/tonic.webp', 'assets/wine/soda.webp',
        'assets/wine/Grenadine-Syrup.webp', 'assets/wine/brandy.webp',
        'assets/people/people1.webp', 'assets/people/people2.webp',
        'assets/people/people3.webp', 'assets/people/people4.webp',
        'assets/people/people5.webp', 'assets/people/people6.webp',
        'assets/people/people7.webp', 'assets/people/people8.webp'
      ];

      var total = allImages.length;
      var loaded = 0;
      var done = false;
      var cache = {};
      window.__imageCache = cache;

      function updateProgress(pct) {
        progressFill.style.width = pct + '%';
        splashText.textContent = '加载中… ' + pct + '%';
      }

      function fadeOut() {
        if (done) return;
        done = true;
        gameWrapper.style.visibility = 'visible';
        splash.classList.add('splash-fade');
        splash.addEventListener('transitionend', function() {
          splash.remove();
        });
      }

      // 阶段1: fetch 下载所有图片为 blob (0% ~ 70%)
      function fetchImage(src) {
        return fetch(src)
          .then(function(r) { if (!r.ok) throw 0; return r.blob(); })
          .then(function(b) { cache[src] = URL.createObjectURL(b); })
          .catch(function() { cache[src] = src; })
          .then(function() {
            loaded++;
            updateProgress(Math.round((loaded / total) * 70));
          });
      }

      updateProgress(0);

      Promise.all(allImages.map(fetchImage))
        .then(function() {
          updateProgress(72);
          // 阶段2: 将 blob URL 赋给 HTML 中的 data-src 图片，并用 decode() 确保解码完成 (70% ~ 85%)
          return applyAndDecodeHtmlImages();
        })
        .then(function() {
          updateProgress(85);
          // 替换 CSS 背景图
          if (cache['assets/bg.webp']) {
            gameWrapper.style.backgroundImage = 'url(' + cache['assets/bg.webp'] + ')';
          }
          // 阶段3: 加载 main.js 并等待 init() 完成 (85% ~ 92%)
          return loadMainScript();
        })
        .then(function() {
          updateProgress(92);
          // 阶段4: 等待 main.js 动态创建的所有图片解码完成 (92% ~ 100%)
          return decodeAllDynamicImages();
        })
        .then(function() {
          updateProgress(100);
          fadeOut();
        });

      // 将 data-src 转为 src（使用 blob URL），并 decode
      function applyAndDecodeHtmlImages() {
        var imgs = document.querySelectorAll('img[data-src]');
        var promises = [];
        imgs.forEach(function(img) {
          var origSrc = img.getAttribute('data-src');
          var blobUrl = cache[origSrc] || origSrc;
          img.src = blobUrl;
          // decode() 确保浏览器完成像素级解码，不会出现半截图
          if (img.decode) {
            promises.push(img.decode().catch(function() {}));
          }
        });
        return Promise.all(promises);
      }

      // 加载 main.js，返回 promise 在 init() 执行完后 resolve
      function loadMainScript() {
        return new Promise(function(resolve) {
          window.__onGameReady = resolve;
          var s = document.createElement('script');
          s.src = 'main.js';
          s.onerror = resolve;
          document.body.appendChild(s);
        });
      }

      // 对页面中所有可见 img 执行 decode()，确保完全解码
      function decodeAllDynamicImages() {
        var imgs = document.querySelectorAll('#cabinetGrid img, .bar-item img, .bar-tool img, .bar-bg img, .sink-area img, .freezer-area img');
        var promises = [];
        imgs.forEach(function(img) {
          if (img.decode) {
            promises.push(img.decode().catch(function() {}));
          }
        });
        return Promise.all(promises);
      }

      // 兜底：最多15秒后强制启动
      setTimeout(function() {
        if (!done) { updateProgress(100); fadeOut(); }
      }, 15000);
    })();
  </script>
</body>
</html>
